description:
  en_US: US company disclosures. Insider trades from SEC Form 4, House members' stock trades, 8-K events and red-flag checks from SEC EDGAR, and projected earnings dates. No API key.
  zh_Hans: 美国公司披露数据。SEC Form 4 内部人交易、美国众议院议员的股票交易、SEC EDGAR 的 8-K 事件与风险信号检查，以及预计财报日期。无需 API 密钥。
  ja_JP: 米国企業の開示情報。SEC Form 4 のインサイダー取引、米下院議員の株取引、SEC EDGAR の 8-K イベントとレッドフラグ検査、予測決算日。API キー不要。
  pt_BR: Divulgações de empresas dos EUA. Negociações de insiders do Form 4 da SEC, negociações de ações de membros da Câmara dos EUA, eventos 8-K e verificações de sinais de alerta da SEC EDGAR, e datas de resultados projetadas. Sem chave de API.
