identity:
  name: prop_firms
  author: optimistfi
  label:
    en_US: Prop Firms
    zh_Hans: 自营交易公司
    ja_JP: プロップファーム
    pt_BR: Mesas proprietárias
description:
  human:
    en_US: Prop firms that fund crypto and stock perps traders, read from each firm's own pages. Rules, every challenge's price, live discount codes, country, platforms and maximum allocation.
    zh_Hans: 为加密货币和股票永续合约交易者提供资金的自营交易公司，数据取自各公司官网：规则、每个挑战的价格、当前折扣码、所在国家、平台和最高资金额度。
    ja_JP: 暗号資産と株式無期限先物のトレーダーに資金を提供するプロップファーム。各社の公式ページから取得：ルール、全チャレンジの価格、現在の割引コード、所在国、プラットフォーム、最大資金額。
    pt_BR: Mesas proprietárias que financiam traders de perpétuos de cripto e ações, lidas das páginas de cada empresa. Regras, o preço de cada desafio, códigos de desconto ativos, país, plataformas e alocação máxima.
  llm: Prop firms that fund crypto and stock perps traders, read from the firms' own pages - rules, challenge prices, live discount codes, country, platforms, assets and maximum allocation. Without a filter it returns a short record for every firm; a filter narrows it where the question allows one.
parameters:
  - name: firm
    type: string
    required: false
    form: llm
    label:
      en_US: Firm
      zh_Hans: 公司
      ja_JP: ファーム
      pt_BR: Empresa
    human_description:
      en_US: One firm by name, for its full record, every challenge and its dated rule changes.
      zh_Hans: 按名称查询单个公司，返回完整资料、全部挑战和带日期的规则变更。
      ja_JP: 名前で 1 社を指定すると、全情報、全チャレンジ、日付付きのルール変更を返します。
      pt_BR: Uma empresa pelo nome, com o registro completo, todos os desafios e as mudanças de regra datadas.
    llm_description: One firm by name (Breakout, HyroTrader, Propr) - its full record, every challenge and its dated rule changes.
  - name: account_usd
    type: number
    required: false
    min: 1
    form: llm
    label:
      en_US: Account size (USD)
      zh_Hans: 账户规模（美元）
      ja_JP: 口座サイズ（米ドル）
      pt_BR: Tamanho da conta (USD)
    human_description:
      en_US: Only challenges of this account size, cheapest to get funded first.
      zh_Hans: 仅显示该账户规模的挑战，按获得资金的总成本从低到高排列。
      ja_JP: この口座サイズのチャレンジのみ、資金提供までの費用が安い順。
      pt_BR: Somente desafios deste tamanho de conta, do mais barato para ser financiado.
    llm_description: Only challenges of this account size in dollars (50000), cheapest to get funded first.
  - name: max_price_usd
    type: number
    required: false
    min: 0
    form: llm
    label:
      en_US: Max price (USD)
      zh_Hans: 最高价格（美元）
      ja_JP: 上限価格（米ドル）
      pt_BR: Preço máximo (USD)
    human_description:
      en_US: Only firms whose cheapest evaluation costs this much or less.
      zh_Hans: 仅显示最便宜评估不超过此价格的公司。
      ja_JP: 最安の評価がこの金額以下のファームのみ。
      pt_BR: Somente empresas cuja avaliação mais barata custa isto ou menos.
    llm_description: Only firms whose cheapest evaluation costs this much or less, in dollars.
  - name: rule
    type: select
    required: false
    form: llm
    label:
      en_US: Rule
      zh_Hans: 规则
      ja_JP: ルール
      pt_BR: Regra
    human_description:
      en_US: Only firms on one rule list.
      zh_Hans: 仅显示符合某一规则的公司。
      ja_JP: いずれかのルールに該当するファームのみ。
      pt_BR: Somente empresas de uma lista de regras.
    llm_description: Only firms on one rule list, such as no-daily-loss-limit, instant-funding or us-traders.
    options:
      - value: static-drawdown
        label:
          en_US: Static drawdown
          zh_Hans: 静态回撤
          ja_JP: 固定ドローダウン
          pt_BR: Drawdown estático
      - value: under-50
        label:
          en_US: Under $50
          zh_Hans: 低于 50 美元
          ja_JP: 50 ドル未満
          pt_BR: Abaixo de US$50
      - value: instant-funding
        label:
          en_US: Instant funding
          zh_Hans: 即时注资
          ja_JP: 即時資金提供
          pt_BR: Financiamento instantâneo
      - value: no-daily-loss-limit
        label:
          en_US: No daily loss limit
          zh_Hans: 无每日亏损限制
          ja_JP: 日次損失上限なし
          pt_BR: Sem limite de perda diária
      - value: stock-perps
        label:
          en_US: Stock perps
          zh_Hans: 股票永续合约
          ja_JP: 株式無期限先物
          pt_BR: Perpétuos de ações
      - value: hyperliquid
        label:
          en_US: On Hyperliquid
          zh_Hans: 基于 Hyperliquid
          ja_JP: Hyperliquid 上
          pt_BR: Na Hyperliquid
      - value: 200k-accounts
        label:
          en_US: $200K accounts
          zh_Hans: 20 万美元账户
          ja_JP: 20 万ドル口座
          pt_BR: Contas de US$200 mil
      - value: us-traders
        label:
          en_US: Open to US traders
          zh_Hans: 接受美国交易者
          ja_JP: 米国在住者も可
          pt_BR: Aceita traders dos EUA
      - value: no-minimum-days
        label:
          en_US: No minimum days
          zh_Hans: 无最少天数要求
          ja_JP: 最低日数なし
          pt_BR: Sem mínimo de dias
  - name: asset
    type: select
    required: false
    form: llm
    label:
      en_US: Asset
      zh_Hans: 资产
      ja_JP: 資産
      pt_BR: Ativo
    human_description:
      en_US: Only firms that offer this asset class.
      zh_Hans: 仅显示提供该资产类别的公司。
      ja_JP: この資産クラスを扱うファームのみ。
      pt_BR: Somente empresas que oferecem esta classe de ativo.
    llm_description: Only firms that offer this asset class.
    options:
      - value: Crypto
        label:
          en_US: Crypto
          zh_Hans: 加密货币
          ja_JP: 暗号資産
          pt_BR: Cripto
      - value: Stocks
        label:
          en_US: Stocks
          zh_Hans: 股票
          ja_JP: 株式
          pt_BR: Ações
      - value: ETFs
        label:
          en_US: ETFs
          zh_Hans: ETF
          ja_JP: ETF
          pt_BR: ETFs
      - value: Indices
        label:
          en_US: Indices
          zh_Hans: 指数
          ja_JP: 株価指数
          pt_BR: Índices
      - value: Commodities
        label:
          en_US: Commodities
          zh_Hans: 大宗商品
          ja_JP: コモディティ
          pt_BR: Commodities
      - value: Forex
        label:
          en_US: Forex
          zh_Hans: 外汇
          ja_JP: 為替
          pt_BR: Câmbio
  - name: country
    type: string
    required: false
    form: llm
    label:
      en_US: Country
      zh_Hans: 国家
      ja_JP: 国
      pt_BR: País
    human_description:
      en_US: Only firms based in this country.
      zh_Hans: 仅显示总部位于该国家的公司。
      ja_JP: この国に拠点を置くファームのみ。
      pt_BR: Somente empresas sediadas neste país.
    llm_description: Only firms based in this country.
  - name: on_chain
    type: boolean
    required: false
    default: false
    form: llm
    label:
      en_US: On-chain only
      zh_Hans: 仅链上
      ja_JP: オンチェーンのみ
      pt_BR: Somente on-chain
    human_description:
      en_US: Only firms whose accounts execute on an on-chain venue.
      zh_Hans: 仅显示账户在链上交易场所执行的公司。
      ja_JP: 口座の注文がオンチェーンの取引所で執行されるファームのみ。
      pt_BR: Somente empresas cujas contas executam em uma corretora on-chain.
    llm_description: True for only firms whose accounts execute on an on-chain venue.
  - name: detail
    type: select
    required: false
    default: full
    form: form
    label:
      en_US: Response detail
      zh_Hans: 返回内容
      ja_JP: 返す内容
      pt_BR: Detalhe da resposta
    human_description:
      en_US: The summary with the full data, or the summary alone to keep an agent's context small.
      zh_Hans: 摘要加完整数据，或仅返回摘要以减少智能体的上下文。
      ja_JP: 要約と全データ、またはエージェントのコンテキストを小さく保つための要約のみ。
      pt_BR: O resumo com os dados completos, ou só o resumo para manter pequeno o contexto do agente.
    options:
      - value: full
        label:
          en_US: Summary and full data
          zh_Hans: 摘要和完整数据
          ja_JP: 要約と全データ
          pt_BR: Resumo e dados completos
      - value: summary
        label:
          en_US: Summary only
          zh_Hans: 仅摘要
          ja_JP: 要約のみ
          pt_BR: Somente o resumo
output_schema:
  type: object
  properties:
    firms:
      type: array
      items:
        type: string
      description: The firms returned, by name.
    count:
      type: integer
      description: How many firms matched.
    as_of:
      type: string
      description: When OptimistFi read the data (UTC).
    source_url:
      type: string
      description: The page or filing the data comes from.
    error:
      type: string
      description: Set when the call did not return data, with the reason.
extra:
  python:
    source: tools/prop_firms.py
