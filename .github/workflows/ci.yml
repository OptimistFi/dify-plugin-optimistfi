name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Fetch the Dify plugin CLI 0.6.12 and check its digest
        run: |
          curl -fsSL -o dify https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.12/dify-plugin-linux-amd64
          echo "f5190893643492c3f17f12c9752615a5652e47bbf30e84298634e176611aa108  dify" | sha256sum -c
          chmod +x dify
      - run: ./dify plugin package . -o optimistfi.difypkg
      - uses: actions/upload-artifact@v4
        with:
          name: optimistfi-difypkg
          path: optimistfi.difypkg
